name: Bug report
description: Report incorrect extraction, source handling, caching, output, or CLI behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic examples only. Do not paste real session records, credentials,
        personal paths, or other private data. Report suspected privacy or source-safety
        vulnerabilities through [SECURITY.md](../../SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit you are running.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Python version and operating system
      placeholder: "Python 3.14 on macOS 26"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and options
      description: Show the command with private paths and values replaced by synthetic ones.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Describe or attach the smallest synthetic source layout that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: Include redacted diagnostics or JSON output when relevant.
    validations:
      required: true
